# DocMe Main Configuration
polling_interval_sec: 1.5
heartbeat_interval_sec: 600.0 # 10 minutes
idle_threshold_sec: 300.0 # 5 minutes

watched_directories:
  - "~/Documents"
  - "~/Desktop"

excluded_apps:
  - "Keychain Access"
  - "1Password"
  - "Bitwarden"
  - "System Settings"
  - "Bank"
  - "Wallet"
  - "Authy"
  - "Security"

sensitive_keywords:
  - "incognito"
  - "private browsing"
  - "password"
  - "login"
  - "bank"
  - "credit card"
  - "security"
  - "personal"
  - "medical"

toggles:
  fswatch: true
  terminal: true
  browser: true
  logic_tracker: true
  auto_reports: false  # Only generate reports on user request

# Auto-report generation interval (in minutes)
auto_report_interval_min: 30

logic_tracking_interval_sec: 300 # 5 minutes

# LLM Configuration for Summaries
llm:
  provider: "openai" # openai-compatible API (works with Ollama)
  api_key: "" # Leave empty for Ollama
  base_url: "http://localhost:11434/v1" # Ollama's OpenAI-compatible endpoint
  model: "gemma3:1b" # Gemma 3 1B model

# Database Configuration
# Set type to 'postgresql' to use Postgres, or 'sqlite' for local file
database:
  type: "postgresql" # options: sqlite, postgresql
  sqlite_path: "data/docme.sqlite"
  postgres:
    user: "lakshmidharkotipalli"
    password: ""
    host: "localhost"
    port: 5432
    dbname: "docme"

export_dir: "data/exports"
db_path: "data/docme.sqlite" # Fallback for legacy code
