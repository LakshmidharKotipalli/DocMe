# DocMe Main Configuration
polling_interval_sec: 0.7
heartbeat_interval_sec: 600.0 # 10 minutes
idle_threshold_sec: 300.0 # 5 minutes

watched_directories:
  - "~/Documents"
  - "~/Desktop"

excluded_apps:
  - "Keychain Access"
  - "1Password"
  - "Bitwarden"
  - "System Settings"
  - "Bank"
  - "Wallet"
  - "Authy"
  - "Security"
  - "DocMe"
  - "Electron"
  - "frontend"
  - "WindowManager"

# AI Applications - capture extended context from these apps
ai_apps:
  - "ChatGPT"
  - "Claude"
  - "Cursor"
  - "Copilot"
  - "Gemini"
  - "Comet"
  - "Perplexity"

sensitive_keywords:
  - "incognito"
  - "private browsing"
  - "password"
  - "login"
  - "bank"
  - "credit card"
  - "security"
  - "personal"
  - "medical"

toggles:
  fswatch: true
  terminal: true
  browser: true
  logic_tracker: true
  auto_reports: false  # Only generate reports on user request

# Auto-report generation interval (in minutes)
auto_report_interval_min: 30

logic_tracking_interval_sec: 300 # 5 minutes

# LLM Configuration for Summaries
llm:
  provider: "openai" # openai-compatible API (works with Ollama)
  api_key: "" # Leave empty for Ollama
  base_url: "http://localhost:8080/v1" # Ollama's OpenAI-compatible endpoint
  model: "ggml-org/gemma-3-1b-it-GGUF" # Gemma 3 1B model (HF Repo)

# Database Configuration
# Set type to 'postgresql' to use Postgres, or 'sqlite' for local file
database:
  type: "sqlite" # options: sqlite, postgresql
  sqlite_path: "" # Leave empty to use platform default (~/Library/Application Support/DocMe/ on macOS)
  postgres:
    # Use environment variables for sensitive credentials
    # Set DOCME_DB_USER, DOCME_DB_PASSWORD, DOCME_DB_HOST, DOCME_DB_PORT, DOCME_DB_NAME
    user: "" # Read from DOCME_DB_USER environment variable
    password: "" # Read from DOCME_DB_PASSWORD environment variable
    host: "localhost" # Can override with DOCME_DB_HOST
    port: 5432 # Can override with DOCME_DB_PORT
    dbname: "docme" # Can override with DOCME_DB_NAME

export_dir: "" # Leave empty to use platform default
db_path: "" # Leave empty to use platform default (deprecated, use database.sqlite_path)
