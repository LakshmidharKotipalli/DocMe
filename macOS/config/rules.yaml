# Tagging and Project Rules
# If a path or window title contains the key, apply the project/tags

projects:
  - name: "DocMe Development"
    paths:
      - "DocMe"
    tags: ["coding", "productivity"]

  - name: "Personal"
    paths:
      - "Photos"
      - "Movies"
    tags: ["media"]

rules:
  - pattern: "paddleocr"
    tags: ["ocr", "ml"]
  - pattern: "qwen"
    tags: ["vlm", "ai"]
  - pattern: "research"
    tags: ["learning"]
