<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DocMe Highlighter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #a3e635 0%, #22c55e 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a3e635;
    }
    
    .status-dot.offline {
      background: #ef4444;
    }
    
    .status-text {
      font-size: 12px;
      color: #94a3b8;
    }
    
    .instructions {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    
    .instructions strong {
      color: #a3e635;
    }
    
    .shortcut {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
    </div>
    <h1>DocMe Highlighter</h1>
  </div>
  
  <div class="status" id="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking connection...</span>
  </div>
  
  <div class="instructions">
    <p><strong>How to use:</strong></p>
    <p style="margin-top: 8px;">
      1. Highlight any text on a webpage<br>
      2. Click the <strong>"Save to DocMe"</strong> button that appears<br>
      3. Or right-click and select <strong>"Save to DocMe Notes"</strong>
    </p>
    <p style="margin-top: 12px; color: #94a3b8;">
      Your highlights will appear in your daily summary report.
    </p>
  </div>
  
  <script>
    async function checkConnection() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      
      try {
        const res = await fetch('http://localhost:8000/events?date=' + new Date().toISOString().split('T')[0] + '&limit=1');
        if (res.ok) {
          dot.classList.remove('offline');
          text.textContent = 'Connected to DocMe';
        } else {
          throw new Error('Not OK');
        }
      } catch (err) {
        dot.classList.add('offline');
        text.textContent = 'DocMe is not running';
      }
    }
    
    checkConnection();
  </script>
</body>
</html>
